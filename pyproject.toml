[project]
name = "autonomous-qa-agent"
version = "0.1.0"
description = "AI-assisted autonomous QA testing system with FastAPI, Playwright, pytest, Pydantic, and SQLite."
requires-python = ">=3.12"
authors = [{ name = "QA Engineering Student" }]
dependencies = [
    "fastapi>=0.110.0,<0.150.0",
    "uvicorn[standard]>=0.30.0",
    "playwright>=1.48.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
qa-agent = "app.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "security: security tests",
    "llm: requires an LLM API key (skipped by default)",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
include = ["app", "app.*"]