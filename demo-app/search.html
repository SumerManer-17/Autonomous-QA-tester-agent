<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search hotels \u2014 DemoShop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header>
    <a href="index.html" class="logo">DemoShop</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="register.html">Register</a>
      <a href="login.html">Sign in</a>
      <a href="search.html" class="active">Search hotels</a>
    </nav>
  </header>

  <main id="main-content">
    <h1>Search hotels</h1>
    <p>Find a hotel for your stay.</p>

    <form id="search-form" action="results.html" novalidate>
      <label>
        Destination
        <input type="text" id="search-destination" name="destination" placeholder="City or hotel name">
        <span id="search-destination-error" class="field-error" data-testid="search-destination-error"></span>
      </label>
      <label>
        Check-in date
        <input type="date" id="search-checkin" name="checkin" required>
        <span id="search-checkin-error" class="field-error" data-testid="search-checkin-error"></span>
      </label>
      <label>
        Check-out date
        <input type="date" id="search-checkout" name="checkout" required>
        <span id="search-checkout-error" class="field-error" data-testid="search-checkout-error"></span>
      </label>
      <label>
        Guests
        <select id="search-guests" name="guests">
          <option value="1">1 guest</option>
          <option value="2" selected>2 guests</option>
          <option value="3">3 guests</option>
          <option value="4">4 guests</option>
        </select>
      </label>
      <label>
        Price filter
        <select id="search-filter" name="filter">
          <option value="any" selected>Any price</option>
          <option value="under100">Under $100/night</option>
          <option value="under150">Under $150/night</option>
        </select>
      </label>
      <button type="submit" class="primary" id="search-submit">Search</button>
    </form>
  </main>

  <footer>
    DemoShop \u2014 local QA demo &middot; synthetic data only.
  </footer>

  <div id="toast" class="status" style="display:none; position:fixed; top:20px; right:20px; z-index:50; min-width:260px;"></div>
  <script src="app.js"></script>
</body>
</html>
